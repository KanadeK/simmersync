name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run full quality gate
        run: npm run check

  package:
    name: Package and clean-install
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run scheduler benchmark
        run: npm run benchmark

      - name: Build release assets
        run: npm run release:build

      - name: Verify checksums and clean install
        run: npm run release:verify

      - name: Upload verified assets
        uses: actions/upload-artifact@v4
        with:
          name: simmersync-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
