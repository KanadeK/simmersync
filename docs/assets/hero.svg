<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SimmerSync</title>
  <desc id="desc">A dark kitchen timeline showing four dishes finishing together at seven o'clock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171816"/>
      <stop offset="1" stop-color="#0b0c0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.08" r="0.8">
      <stop stop-color="#ef7d57" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ef7d57" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="32" fill="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="82" fill="#ef7d57" font-size="16" font-weight="800" letter-spacing="4">MAKE EVERY DISH LAND HOT</text>
    <text x="68" y="158" fill="#f7f1e7" font-size="68" font-weight="850" letter-spacing="-4">SimmerSync</text>
    <text x="72" y="201" fill="#b9b1a5" font-size="23">Resource-aware backward scheduling for real kitchens.</text>

    <g transform="translate(72 252)" filter="url(#shadow)">
      <rect width="1056" height="202" rx="22" fill="#171816" stroke="#34352f"/>
      <line x1="170" y1="0" x2="170" y2="202" stroke="#34352f"/>
      <line x1="170" y1="50" x2="1056" y2="50" stroke="#34352f"/>
      <line x1="170" y1="100" x2="1056" y2="100" stroke="#34352f"/>
      <line x1="170" y1="150" x2="1056" y2="150" stroke="#34352f"/>
      <line x1="1008" y1="0" x2="1008" y2="202" stroke="#ef7d57" stroke-width="2" stroke-dasharray="5 7"/>

      <circle cx="28" cy="26" r="5" fill="#e76f51"/>
      <circle cx="28" cy="76" r="5" fill="#e9c46a"/>
      <circle cx="28" cy="126" r="5" fill="#2a9d8f"/>
      <circle cx="28" cy="176" r="5" fill="#9b5de5"/>
      <text x="44" y="32" fill="#f7f1e7" font-size="15" font-weight="700">Roast chicken</text>
      <text x="44" y="82" fill="#f7f1e7" font-size="15" font-weight="700">Potatoes</text>
      <text x="44" y="132" fill="#f7f1e7" font-size="15" font-weight="700">Greens</text>
      <text x="44" y="182" fill="#f7f1e7" font-size="15" font-weight="700">Gravy</text>

      <rect x="198" y="13" width="118" height="25" rx="7" fill="#e76f51" fill-opacity=".24" stroke="#e76f51"/>
      <rect x="326" y="13" width="407" height="25" rx="7" fill="#e76f51" fill-opacity=".15" stroke="#e76f51"/>
      <rect x="825" y="13" width="66" height="25" rx="7" fill="#e76f51" fill-opacity=".28" stroke="#e76f51"/>
      <rect x="486" y="63" width="93" height="25" rx="7" fill="#e9c46a" fill-opacity=".23" stroke="#e9c46a"/>
      <rect x="589" y="63" width="419" height="25" rx="7" fill="#e9c46a" fill-opacity=".14" stroke="#e9c46a"/>
      <rect x="745" y="113" width="79" height="25" rx="7" fill="#2a9d8f" fill-opacity=".25" stroke="#2a9d8f"/>
      <rect x="943" y="113" width="65" height="25" rx="7" fill="#2a9d8f" fill-opacity=".28" stroke="#2a9d8f"/>
      <rect x="676" y="163" width="77" height="25" rx="7" fill="#9b5de5" fill-opacity=".28" stroke="#9b5de5"/>
      <rect x="915" y="163" width="93" height="25" rx="7" fill="#9b5de5" fill-opacity=".16" stroke="#9b5de5"/>
      <text x="986" y="-12" fill="#ef7d57" font-size="14" font-weight="800">19:00</text>
    </g>
  </g>
</svg>
